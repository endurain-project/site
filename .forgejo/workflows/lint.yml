name: Lint

on:
  push:
    branches:
      - master
      - main
    paths:
      - site/**
      - .forgejo/workflows/lint.yml
  pull_request:
    paths:
      - site/**
      - .forgejo/workflows/lint.yml

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint (format + lint)
    runs-on: local-runner
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: site
        run: npm run format:check

      - name: Check linting (ESLint)
        working-directory: site
        run: npm run lint:check
